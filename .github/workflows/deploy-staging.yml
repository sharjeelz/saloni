name: Deploy · Staging

# Staging tracks the develop branch. Images are built ON THE HOST (a native
# ARM64 Ampere A1 box), so this workflow does no building at all — it just tells
# the host to pull the new commit and rebuild. See deploy/README.md.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Roll out to staging host
    runs-on: ubuntu-latest
    # Only runs once the staging host secrets/vars are configured; else skips.
    if: ${{ vars.STAGING_ENABLED == 'true' }}
    steps:
      - name: Pull & rebuild on the host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          # 20 min: the first build compiles the Next.js bundle and installs
          # Composer deps from scratch. Later builds hit Docker's layer cache.
          command_timeout: 20m
          script: |
            set -e
            cd /srv/salon
            git fetch origin develop
            git reset --hard origin/develop

            cd /srv/salon/deploy
            # Builds api + web from the working tree, then recreates changed
            # containers. NEXT_PUBLIC_API_URL is a build arg read from .env.
            docker compose up -d --build

            # Runtime artisan steps — .env is already on the host.
            docker compose exec -T api php artisan migrate --force
            docker compose exec -T api php artisan storage:link
            docker compose exec -T api php artisan config:cache
            docker compose exec -T api php artisan route:cache
            docker compose exec -T api php artisan view:cache
            # Tell the long-running worker to reload the new code.
            docker compose exec -T api php artisan queue:restart

            # Reclaim space from superseded build layers — matters on a 50 GB
            # boot volume when every deploy builds locally.
            docker image prune -f
