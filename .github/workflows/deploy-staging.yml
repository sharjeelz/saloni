name: Deploy · Staging

# Staging tracks the develop branch. Builds the API image, pushes it to the
# GitHub Container Registry, then (optionally) rolls it out on the staging host.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}/api

jobs:
  build-and-push:
    name: Build & push API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      # Provisions a buildx builder on the docker-container driver, which is
      # required for exporting the GitHub Actions build cache (type=gha).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: echo "tags=${IMAGE}:staging-${GITHUB_SHA::7},${IMAGE}:staging-latest" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Roll out to staging host
    needs: build-and-push
    runs-on: ubuntu-latest
    # Only runs once the staging host secrets are configured; otherwise skips.
    if: ${{ vars.STAGING_ENABLED == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /srv/salon
            docker compose pull api
            docker compose up -d api
            docker compose exec -T api php artisan migrate --force
